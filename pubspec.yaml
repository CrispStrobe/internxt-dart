name: internxt_client
description: >-
  Internxt cloud storage client + CLI for Dart. Pure-Dart port of the
  Python internxt-cli. Provides login/auth, drive operations
  (list/move/rename/copy/trash), encrypted upload/download with
  resumable batch state, parallel-worker pool, memory-gated
  concurrency, and a WebDAV server bridging Internxt to standard
  file-system clients.
version: 0.2.1
homepage: https://github.com/CrispStrobe/internxt-dart
repository: https://github.com/CrispStrobe/internxt-dart
issue_tracker: https://github.com/CrispStrobe/internxt-dart/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

# Phase 9.4 publish prep. The CLI is the executable entry-point
# (`inxt`); the library entry-point will land when the full lib/
# restructure ships in Phase 6.a.next (gated on cloud-dart being
# ready to consume — see PLAN.md).
executables:
  inxt: inxt

dependencies:
  http: ^1.1.0
  pointycastle: ^3.7.3
  bip39: ^1.0.6
  crypto: ^3.0.3
  hex: ^0.2.0
  args: ^2.7.0
  glob: ^2.1.3
  intl: ">=0.19.0 <1.0.0"
  path: ^1.8.0       # POSIX path utils (used by webdav_filesystem.dart)

  # WebDAV Dependencies
  shelf: ^1.4.0
  shelf_router: ^1.1.0 # Good for adding other handlers
  shelf_dav: ^1.0.0  # The server
  file: ^7.0.0       # The virtual filesystem interface
  dart_pg: ^2.0.0

dev_dependencies:
  test: ^1.24.0
  coverage: ^1.6.0
  lints: ^4.0.0
