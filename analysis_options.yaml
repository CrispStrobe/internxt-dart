# Dart static analysis configuration.
#
# Uses package:lints/recommended.yaml — the Dart team's curated set of
# style + correctness rules — plus a few stricter language settings.
#
# Run: dart analyze
include: package:lints/recommended.yaml

analyzer:
  # Phase 4 contained the JSON parsing layer in api.dart. Phase 9.3
  # re-enabled `strict-casts` to surface real type imprecisions
  # across the rest of the codebase.
  #
  # `strict-inference` and `strict-raw-types` stay off for now —
  # they were producing too much signal-from-noise on the dynamic
  # JSON returns coming through `inxt_api`. Worth revisiting after
  # the 0.1.0 library publish (Phase 6) when we can decide what
  # parts of the public surface are typed vs. dynamic.
  language:
    strict-casts: true

  errors:
    # Treat these as errors so CI fails on them
    unused_import: error
    unused_local_variable: warning
    unused_element: warning
    override_on_non_overriding_member: error
    deprecated_export_use: warning

  exclude:
    - .dart_tool/**
    - build/**

linter:
  rules:
    - prefer_relative_imports
    - unnecessary_lambdas
    - unnecessary_brace_in_string_interps
    - prefer_final_locals
