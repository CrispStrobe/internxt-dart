# Dart static analysis configuration.
#
# Uses package:lints/recommended.yaml — the Dart team's curated set of
# style + correctness rules — plus a few stricter language settings.
#
# Run: dart analyze
include: package:lints/recommended.yaml

analyzer:
  # All three strict-mode flags on:
  # - strict-casts (Phase 9.3): no implicit downcasts from `dynamic`.
  # - strict-inference: every variable / return type must have a
  #   concrete inferable type; a fall-back to `dynamic` is an error.
  # - strict-raw-types: generic types without parameters
  #   (e.g. bare `List` instead of `List<dynamic>`) are an error.
  #
  # The dynamic JSON parsing surface in api.dart is the typical
  # blocker — addressed by explicit `as Map<String, dynamic>` /
  # `as List<dynamic>` casts at the JSON-decode boundary.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Treat these as errors so CI fails on them
    unused_import: error
    unused_local_variable: warning
    unused_element: warning
    override_on_non_overriding_member: error
    deprecated_export_use: warning

  exclude:
    - .dart_tool/**
    - build/**

linter:
  rules:
    - prefer_relative_imports
    - unnecessary_lambdas
    - unnecessary_brace_in_string_interps
    - prefer_final_locals
